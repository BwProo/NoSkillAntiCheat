name: Release

# Builds the plugin and attaches the jar to a GitHub release whenever a version tag is pushed,
# e.g.: git tag v2.3.75-nsac.1 && git push origin v2.3.75-nsac.1
on:
    push:
        tags:
            - 'v*'

permissions:
    contents: write

jobs:
    release:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v6
              with:
                  fetch-depth: 0
                  persist-credentials: false

            - name: Set up JDK 25
              uses: actions/setup-java@v5
              with:
                  java-version: '25'
                  distribution: 'temurin'

            - name: Setup Gradle
              uses: gradle/actions/setup-gradle@v6

            - name: Build plugin
              run: ./gradlew build --no-daemon -Prelease=true

            - name: Create release with the plugin jar
              env:
                  GH_TOKEN: ${{ github.token }}
                  TAG: ${{ github.ref_name }}
              run: |
                  JAR=$(ls bukkit/build/libs/noskillanticheat-bukkit-*.jar | grep -v -e sources -e javadoc | head -1)
                  PROXY=$(ls velocity/build/libs/noskillanticheat-velocity-*.jar | head -1)
                  echo "Uploading $JAR and $PROXY"
                  gh release create "$TAG" "$JAR" "$PROXY" --repo "$GITHUB_REPOSITORY" --title "NoSkillAntiCheat $TAG" --generate-notes
