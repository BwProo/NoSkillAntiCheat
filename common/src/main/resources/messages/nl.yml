# \u00BB is » (double >>), ANSI en UTF-8 interpreteren dit anders... je kunt zelfs "?" zien als gevolg hiervan
prefix: "&5&lNSAC &8\u00BB"

alerts-enabled: "%prefix% &fMeldingen ingeschakeld"
alerts-disabled: "%prefix% &fMeldingen uitgeschakeld"
verbose-enabled: "%prefix% &fVerbose enabled"
verbose-disabled: "%prefix% &fVerbose disabled"
brands-enabled: "%prefix% &fBrands enabled"
brands-disabled: "%prefix% &fBrands disabled"
client-brand-format: "%prefix% &f%player% is lid geworden met %brand%"
console-specify-target: "%prefix% &cJe moet een doel opgeven als de console!"
reloading: "%prefix% &7Reloading config..."
reloaded: "%prefix% &fConfig has been reloaded."
reload-failed: "%prefix% &cFailed to reload config."
player-not-found: "%prefix% &cSpeler is vrijgesteld of offline!"
player-not-this-server: "%prefix% &cSpeler is niet op deze server!"
sender-not-found: "%prefix% &cJe kunt dit commando niet gebruiken als je vrijgesteld bent!"
spectate-return: "<click:run_command:/nsac stopspectating><hover:show_text:\"/nsac stopspectating\">\n%prefix% &fKlik hier om terug te keren naar de vorige locatie\n</hover></click>"
cannot-spectate-return: "%prefix% &cJe kunt dit alleen doen nadat je een speler hebt bekeken"
cannot-run-on-self: "%prefix% &cJe kunt dit commando niet op jezelf gebruiken!"
upload-log: "%prefix% &fDebug geüpload naar: %url%"
upload-log-start: "%prefix% &fLog wordt geüpload... even geduld"
upload-log-not-found: "%prefix% &cKan dat log niet vinden"
upload-log-upload-failure: "%prefix% &cEr is iets misgegaan tijdens het uploaden van dit log, zie console voor meer informatie"
disconnect:
    timeout: "<lang:disconnect.timeout>"
    closed: "<lang:disconnect.closed>"
    error: "<red>An error occurred whilst processing packets. Please contact the administrators."
    blacklisted-forge: "<red>Your forge version is blacklisted due to inbuilt reach hacks.<newline><gold>Versions affected: 1.18.2-1.19.3<newline><newline><red>Please see https://github.com/MinecraftForge/MinecraftForge/issues/9309."
run-as-player: "%prefix% &cDit commando kan alleen door spelers worden gebruikt!"
run-as-player-or-console: "%prefix% &cDit commando kan alleen door spelers of de console worden gebruikt!"
webhook-not-enabled: "Discord webhooks are not enabled!"
webhook-test-message: "test message"
webhook-test-succeeded: "Discord webhook test succeeded!"
webhook-test-failed: "Discord webhook test failed!"

# Geldige plaatsaanduidingen:
# %prefix%
# %player%
# %check_name%
# %description%
# %experimental%
# %vl% - overtredingen
# %verbose% - extra informatie van de controle zoals offsets, niet alle controles voegen informatie toe
alerts-format: "%prefix% &f%player% &dmislukt <hover:show_text:\"&d%check_name%%experimental%\n&8Beschrijving: &f%description%\">&f%check_name%%experimental%</hover> &f(x&c%vl%&f) &7%verbose%"
alerts-format-proxy: "%prefix% &f[&cproxy&f] &f%player% &dmislukt <hover:show_text:\"&d%check_name%%experimental%\n&8Beschrijving: &f%description%\">&f%check_name%%experimental%</hover> &f(x&c%vl%&f) &7%verbose%"
experimental-symbol: "*"

profile:
    - "&7======================"
    - "%prefix% &dProfiel voor &f%player%"
    - "&dPing: &f%ping%"
    - "&dVersie: &f%version%"
    - "&dClient Merk: &f%brand%"
    - "&dHorizontale Gevoeligheid: &f%h_sensitivity%%"
    - "&dVerticale Gevoeligheid: &f%v_sensitivity%%"
    - "&dFastMath Ingeschakeld: &f%fast_math%"
    - "&7======================"
help:
    - "&7======================"
    - "/nsac alerts &f- &7Meldingen inschakelen"
    - "/nsac brands &f- &7Toggle brands"
    - "/nsac profile <player> &f- &7Bekijk speler info"
    - "/nsac help &f- &7Bekijk dit helpbericht"
    - "/nsac debug <player> &f- &7Voorspellingsuitvoer ontwikkelaar"
    - "/nsac perf &f- &7Ontwikkelaar ms/voorspelling"
    - "/nsac reload &f- &7Laadt de configuratie opnieuw"
    - "/nsac spectate <player> &f- &7Een speler bekijken"
    - "/nsac verbose &f- &7Toont elke flag, zonder buffers"
    - "/nsac log [0-255] &f- &7Uploadt een debug-log voor voorspellings-flaggen"
    - "/nsac history <player> &f- &7Sessielijst (nieuwste eerst)"
    - "/nsac history <player> page <N> &f- &7Spring naar pagina N van de sessielijst"
    - "/nsac history <player> session <N|latest> [-d] [-v] &f- &7Sessiedetail (nieuwste overtredingen eerst)"
    - "/nsac history <player> session <N|latest> page <N> [-d] [-v] &f- &7Sessiedetail, overtredingenpagina N"
    - "&7======================"

# === /nsac history ===
# Op sessies gebaseerde geschiedenis-UI. Alle regels hieronder zijn instelbare
# MiniMessage-templates. Standaard hovers staan in inline
# <hover:show_text:'...'>-tags en de hoverfragment-sleutels hieronder; verwijder
# de inline hover om de renderer-fallback te gebruiken.

grim-history-load-failure: "%prefix% &cGeschiedenissubsysteem kon niet worden geladen! Controleer de serverconsole op fouten."
grim-history-disabled: "%prefix% &cHet geschiedenissubsysteem is uitgeschakeld!"
grim-history-failed: "%prefix% &cKon geschiedenis niet laden: &7%error%"
grim-history-unknown-player: "%prefix% &cOnbekende speler: &f%player%"
grim-history-no-sessions: "%prefix% &7Geen sessiegeschiedenis voor &f%player%&7."
grim-history-session-not-found: "%prefix% &cSessie &f%ordinal%&c niet gevonden voor &f%player%&c."

# Sessielijst — geldige placeholders: %prefix% %player% %page% %max_pages%
grim-history-header: "%prefix% &dSessiegeschiedenis tonen voor &f%player% &8[&f%page%&7/&f%max_pages%&8]"
# Samenvattingsregel per sessie — geldige placeholders:
#   %prefix% %player% %ordinal% %grim_version% %server_name%
#   %client_version% %client_brand% %duration% %timeago%
#   %violations% %unique_checks% %crashed_marker% %session_uuid% %detail_command%
# %crashed_marker% breidt uit naar grim-history-crashed-marker voor sessies
# waarvan de verbinding zonder nette afsluiting wegviel (servercrash, kill -9,
# kanaal-RST die geen UserDisconnectEvent vuurt). Lege string voor lopende of
# netjes gesloten sessies.
grim-history-session: "<hover:show_text:'&dSessie &7%session_uuid%<newline>&7Klik of voer &e%detail_command% &7uit<newline>&7om sessiedetails te bekijken.'>%prefix% &8[&d%grim_version%&8] &8[&d%server_name%&8] &8[&d%client_version%&8] &dSessie &f%ordinal%&d, duur &f%duration%&d, met &c%violations%&d overtredingen &8[&c%unique_checks%&8]%crashed_marker% &8(&7%timeago% geleden&8)</hover>"

# Inline-markering die in %crashed_marker% wordt geplaatst voor sessies met
# closed_at == last_activity (d.w.z. gestempeld door de crash-sweep bij de
# volgende start, niet door het disconnect-pad). Begint met een spatie zodat
# de markering natuurlijk leest wanneer aanwezig en netjes verdwijnt
# wanneer leeg.
grim-history-crashed-marker: " &8(&cgecrasht&8)"

# Sessiedetail — geldige placeholders:
#   %prefix% %player% %ordinal% %grim_version% %server_name%
#   %client_version% %client_brand% %duration% %timeago%
#   %violations% %unique_checks% %bucket_size%
grim-history-detail-header: "%prefix% &dDetails van sessie &f%ordinal% &dvan &f%player%&d:"
grim-history-detail-meta1: "%prefix% &dNSAC: &f%grim_version%&d, Server: &f%server_name%&d, Duur: &f%duration%&d, Datum: &7%timeago% geleden"
grim-history-detail-meta2: "%prefix% &dClient: &f%client_version%&d, Merk: &f%client_brand%"
grim-history-detail-violations-header: "%prefix% &dOvertredingen: &8(%violations% totaal, %unique_checks% uniek)"
grim-history-detail-empty: "%prefix% &7- (geen)"
# Gegroepeerde regel (standaard) — geldige placeholders: %prefix% %offset% %checks_list%
#   %bucket_start% %bucket_end% %bucket_hover_entries%
#   %checks_list% wordt gebouwd door grim-history-check-count-items te verbinden met ", "
grim-history-detail-group: "<hover:show_text:'&dOvertredingen in &f%bucket_start%–%bucket_end%&d:%bucket_hover_entries%'>%prefix% &7- %checks_list% &8(&d%offset%&8)</hover>"
grim-history-detail-group-hover: "&dOvertredingen in &f%bucket_start%–%bucket_end%&d:%bucket_hover_entries%"
grim-history-detail-group-hover-entry: "<newline>&8  %offset% &d%check%%description%%verbose%"
grim-history-hover-description: " — &f%description%"
grim-history-detail-group-hover-verbose: " — &7%verbose%"
# Enkele ruwe overtredingsregel (--detailed) — geldige placeholders:
#   %prefix% %offset% %check% %description% %vl% %verbose%
grim-history-detail-entry: "%prefix% &7- &f%check% &8(&d%offset%&8)&7 %verbose%"
grim-history-detail-entry-hover: "&d%check%%description%<newline>&8@ %offset% — vl %vl%%verbose%"
grim-history-detail-entry-hover-verbose: "<newline>&7%verbose%"
# Intern formaat per check in %checks_list% — geldige placeholders: %check_name% %count%
grim-history-check-count: "&f%check_name%&7 x&c%count%"

# Schemamarkers — zie de header-comment in config.yml.
config-flavor: V2
config-version: 2
