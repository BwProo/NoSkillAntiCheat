# \u00BB se traduit par » (double >>). Les interprétations diffèrent entre les normes ANSI et UTF-8... vous pouvez même voir ? en raison de cela
prefix: "&5&lNSAC &8\u00BB"

alerts-enabled: "%prefix% &fAlertes activées"
alerts-disabled: "%prefix% &fAlertes désactivées"
verbose-enabled: "%prefix% &fVerbose enabled"
verbose-disabled: "%prefix% &fVerbose disabled"
brands-enabled: "%prefix% &fBrands enabled"
brands-disabled: "%prefix% &fBrands disabled"
client-brand-format: "%prefix% &f%player% a rejoint en utilisant %brand%"
console-specify-target: "%prefix% &cVous devez spécifier une cible en tant que console !"
reloading: "%prefix% &7Reloading config..."
reloaded: "%prefix% &fConfig has been reloaded."
reload-failed: "%prefix% &cFailed to reload config."
player-not-found: "%prefix% &cPlayer est ignoré ou hors ligne !"
player-not-this-server: "%prefix% &cPlayer n'est pas sur ce serveur !"
sender-not-found: "%prefix% &cVous ne pouvez pas utiliser cette commande si vous êtes exempté !"
spectate-return: "<click:run_command:/nsac stopspectating><hover:show_text:\"/nsac stopspectating\">\n%prefix% &fClickez ici pour retourner à votre position d'origine\n</hover></click>"
cannot-spectate-return: "%prefix% &cVous pouvez faire cela uniquement en étant en spectateur"
cannot-run-on-self: "%prefix% &cVous ne pouvez pas utiliser cette commande sur vous-même !"
upload-log: "%prefix% &fLe fichier de débogage a été téléversé vers : %url%"
upload-log-start: "%prefix% &fTéléversement du journal... Veuillez patienter"
upload-log-not-found: "%prefix% &cUImpossible de trouver le journal de débogage"
upload-log-upload-failure: "%prefix% &cUne erreur est survenue lors du téléversement de ce journal, regardez la console pour plus d'information"
disconnect:
    timeout: "<lang:disconnect.timeout>"
    closed: "<lang:disconnect.closed>"
    error: "<red>An error occurred whilst processing packets. Please contact the administrators."
    blacklisted-forge: "<red>Your forge version is blacklisted due to inbuilt reach hacks.<newline><gold>Versions affected: 1.18.2-1.19.3<newline><newline><red>Please see https://github.com/MinecraftForge/MinecraftForge/issues/9309."
run-as-player: "%prefix% &cCette commande ne peut être utilisée que par les joueurs !"
run-as-player-or-console: "%prefix% &cCette commande ne peut être utilisée que par les joueurs ou la console !"
webhook-not-enabled: "Discord webhooks are not enabled!"
webhook-test-message: "test message"
webhook-test-succeeded: "Discord webhook test succeeded!"
webhook-test-failed: "Discord webhook test failed!"

# Placeholders valides :
# %prefix%
# %player%
# %check_name%
# %description%
# %experimental%
# %vl% - violations
# %verbose% - Informations supplémentaires sur les vérifivations comme les écarts, toutes les vérifications n'ajoutent pas d'information
alerts-format: "%prefix% &f%player% &da échoué <hover:show_text:\"&d%check_name%%experimental%\n&8Description: &f%description%\">&f%check_name%%experimental%</hover> &f(x&c%vl%&f) &7%verbose%"
alerts-format-proxy: "%prefix% &f[&cproxy&f] &f%player% &da échoué <hover:show_text:\"&d%check_name%%experimental%\n&8Description: &f%description%\">&f%check_name%%experimental%</hover> &f(x&c%vl%&f) &7%verbose%"
experimental-symbol: "*"

profile:
    - "&7======================"
    - "%prefix% &dProfil de &f%player%"
    - "&dPing: &f%ping%"
    - "&dVersion du client : &f%version%"
    - "&dNature du client : &f%brand%"
    - "&dSensibilité Horizontale : &f%h_sensitivity%%"
    - "&dSensibilité Verticale : &f%v_sensitivity%%"
    - "&dFastMath est activé : &f%fast_math%"
    - "&7======================"
help:
    - "&7======================"
    - "/nsac alerts &f- &7Activer/Désactiver les alertes"
    - "/nsac brands &f- &7Toggle brands"
    - "/nsac profile <player> &f- &7Voir le profil du joueur"
    - "/nsac help &f- &7Afficher l'aide"
    - "/nsac debug <player> &f- &7Afficher les informations de débogage du joueur"
    - "/nsac perf &f- &7Afficher les informations de performance"
    - "/nsac reload &f- &7Recharger la configuration"
    - "/nsac spectate <player> &f- &7Regarder un joueur"
    - "/nsac verbose &f- &7Affiche chaqu'une de vos violations, sans tampons"
    - "/nsac log [0-255] &f- &7Téléverse un journal de débogage pour les indicateurs de prédiction"
    - "/nsac history <player> &f- &7Liste des sessions (les plus récentes en premier)"
    - "/nsac history <player> page <N> &f- &7Aller à la page N de la liste des sessions"
    - "/nsac history <player> session <N|latest> [-d] [-v] &f- &7Détail d'une session (violations les plus récentes en premier)"
    - "/nsac history <player> session <N|latest> page <N> [-d] [-v] &f- &7Détail d'une session, page N des violations"
    - "&7======================"

# === /nsac history ===
# UI d'historique basée sur les sessions. Toutes les lignes ci-dessous sont des
# modèles MiniMessage configurables. Les hovers par défaut vivent dans les tags
# inline <hover:show_text:'...'> et les clés de fragments de hover ci-dessous ;
# retirez le hover inline pour utiliser le fallback du renderer.

grim-history-load-failure: "%prefix% &cLe sous-système d'historique n'a pas pu être chargé ! Vérifiez la console du serveur pour les erreurs."
grim-history-disabled: "%prefix% &cLe sous-système d'historique est désactivé !"
grim-history-failed: "%prefix% &cÉchec du chargement de l'historique : &7%error%"
grim-history-unknown-player: "%prefix% &cJoueur inconnu : &f%player%"
grim-history-no-sessions: "%prefix% &7Pas d'historique de sessions pour &f%player%&7."
grim-history-session-not-found: "%prefix% &cSession &f%ordinal%&c introuvable pour &f%player%&c."

# Liste des sessions — placeholders valides : %prefix% %player% %page% %max_pages%
grim-history-header: "%prefix% &dAffichage de l'historique des sessions pour &f%player% &8[&f%page%&7/&f%max_pages%&8]"
# Ligne de résumé d'une session — placeholders valides :
#   %prefix% %player% %ordinal% %grim_version% %server_name%
#   %client_version% %client_brand% %duration% %timeago%
#   %violations% %unique_checks% %crashed_marker% %session_uuid% %detail_command%
# %crashed_marker% s'étend en grim-history-crashed-marker pour les sessions
# dont la connexion a disparu sans fermeture propre (crash serveur, kill -9,
# RST de canal sans UserDisconnectEvent). Chaîne vide pour les sessions en
# cours ou closes proprement.
grim-history-session: "<hover:show_text:'&dSession &7%session_uuid%<newline>&7Cliquez ou exécutez &e%detail_command%<newline>&7pour afficher les détails de la session.'>%prefix% &8[&d%grim_version%&8] &8[&d%server_name%&8] &8[&d%client_version%&8] &dSession &f%ordinal%&d, durée &f%duration%&d, avec &c%violations%&d violations &8[&c%unique_checks%&8]%crashed_marker% &8(&7il y a %timeago%&8)</hover>"

# Marqueur en ligne substitué dans %crashed_marker% pour les sessions dont
# closed_at == last_activity (c.-à-d. estampillées par le balayage de crash
# au prochain démarrage, et non par le chemin de déconnexion). Inclut un
# espace de tête pour que le marqueur se lise naturellement quand il est
# présent et disparaisse proprement quand il est vide.
grim-history-crashed-marker: " &8(&ccrash&8)"

# Détail de session — placeholders valides :
#   %prefix% %player% %ordinal% %grim_version% %server_name%
#   %client_version% %client_brand% %duration% %timeago%
#   %violations% %unique_checks% %bucket_size%
grim-history-detail-header: "%prefix% &dDétail de la session &f%ordinal% &dde &f%player%&d :"
grim-history-detail-meta1: "%prefix% &dNSAC : &f%grim_version%&d, Serveur : &f%server_name%&d, Durée : &f%duration%&d, Date : &7il y a %timeago%"
grim-history-detail-meta2: "%prefix% &dClient : &f%client_version%&d, Marque : &f%client_brand%"
grim-history-detail-violations-header: "%prefix% &dViolations : &8(%violations% au total, %unique_checks% uniques)"
grim-history-detail-empty: "%prefix% &7- (aucune)"
# Ligne groupée (par défaut) — placeholders valides : %prefix% %offset% %checks_list%
#   %bucket_start% %bucket_end% %bucket_hover_entries%
#   %checks_list% est construite en joignant les entrées grim-history-check-count avec ", "
grim-history-detail-group: "<hover:show_text:'&dViolations entre &f%bucket_start%–%bucket_end%&d :%bucket_hover_entries%'>%prefix% &7- %checks_list% &8(&d%offset%&8)</hover>"
grim-history-detail-group-hover: "&dViolations entre &f%bucket_start%–%bucket_end%&d :%bucket_hover_entries%"
grim-history-detail-group-hover-entry: "<newline>&8  %offset% &d%check%%description%%verbose%"
grim-history-hover-description: " — &f%description%"
grim-history-detail-group-hover-verbose: " — &7%verbose%"
# Ligne de violation brute (--detailed) — placeholders valides :
#   %prefix% %offset% %check% %description% %vl% %verbose%
grim-history-detail-entry: "%prefix% &7- &f%check% &8(&d%offset%&8)&7 %verbose%"
grim-history-detail-entry-hover: "&d%check%%description%<newline>&8@ %offset% — vl %vl%%verbose%"
grim-history-detail-entry-hover-verbose: "<newline>&7%verbose%"
# Format interne pour chaque check dans %checks_list% — placeholders valides : %check_name% %count%
grim-history-check-count: "&f%check_name%&7 x&c%count%"

# Marqueurs de schéma — voir le commentaire d'en-tête dans config.yml.
config-flavor: V2
config-version: 2
