webhook-test-succeeded: "Discord webhook test succeeded!"
webhook-test-failed: "Discord webhook test failed!"

# Gültige Platzhalter:
# %prefix%
# %player%
# %check_name%
# %description%
# %experimental%
# %vl% - Verstöße
# %verbose% - zusätzliche Informationen von der Prüfung, nicht alle Prüfungen liefern zusätzliche Informationen
alerts-format: "%prefix% &f%player% &7» <click:run_command:'/nsac spectate %player%'><hover:show_text:\"&c%check_name%%experimental% &8| &7%description%\n&7Details: &f%verbose%\n&7Verstöße: &f%vl%\n&7ID: &f%stable_key%\n&8Klicken zum Zuschauen\">&c%check_name%%experimental%</hover></click> &8(&7x%vl%&8)"
alerts-format-proxy: "%prefix% &f[&cproxy&f] &f%player% &dbestand <hover:show_text:\"&d%check_name%%experimental%\n&8Beschreibung: &f%description%\">&f%check_name%%experimental%</hover> &dnicht &f(x&c%vl%&f) &7%verbose%"
experimental-symbol: "*"

profile:
    - "&7======================"
    - "%prefix% &dProfil für &f%player%"
    - "&dPing: &f%ping%"
    - "&dVersion: &f%version%"
    - "&dClient Marke: &f%brand%"
    - "&dHorizontale Sensitivität: &f%h_sensitivity%%"
    - "&dVertikale Sensitivität: &f%v_sensitivity%%"
    - "&dFastMath aktiviert: &f%fast_math%"
    - "&7======================"
help:
    - "&7======================"
    - "/nsac alerts &f- &7Schaltet Benachrichtigungen um"
    - "/nsac brands &f- &7Toggle brands"
    - "/nsac profile <player> &f- &7Zeigt Informationen über einen Spieler an"
    - "/nsac help &f- &7Zeigt diese Hilfsnachricht an"
    - "/nsac debug <player> &f- &7Entwicklerausgabe für Vorhersagen"
    - "/nsac perf &f- &7Entwickler ms/Vorhersage"
    - "/nsac reload &f- &7Lädt die Konfiguration neu"
    - "/nsac spectate <player> &f- &7Beobachte einen Spieler"
    - "/nsac verbose &f- &7Zeigt dir jeden Verstoß ohne Puffer an"
    - "/nsac log [0-255] &f- &7Lädt ein Debug-Log für Vorhersagefehler hoch"
    - "/nsac history <player> &f- &7Sitzungsliste (neueste zuerst)"
    - "/nsac history <player> page <N> &f- &7Springt zu Seite N der Sitzungsliste"
    - "/nsac history <player> session <N|latest> [-d] [-v] &f- &7Sitzungsdetails (neueste Verstöße zuerst)"
    - "/nsac history <player> session <N|latest> page <N> [-d] [-v] &f- &7Sitzungsdetails, Verstoß-Seite N"
    - "&7======================"

# === /nsac history ===
# Sitzungsbasierte Verlaufs-UI. Alle Zeilen unten sind konfigurierbare
# MiniMessage-Vorlagen. Standard-Hover stehen in Inline-Tags
# <hover:show_text:'...'> und den Hover-Fragment-Schlüsseln unten; entferne
# den Inline-Hover, um den Renderer-Fallback zu verwenden.

grim-history-load-failure: "%prefix% &cDas Verlaufs-Subsystem konnte nicht geladen werden! Überprüfe die Serverkonsole auf Fehler."
grim-history-disabled: "%prefix% &cDas History-Subsystem ist deaktiviert!"
grim-history-failed: "%prefix% &cVerlauf konnte nicht geladen werden: &7%error%"
grim-history-unknown-player: "%prefix% &cUnbekannter Spieler: &f%player%"
grim-history-no-sessions: "%prefix% &7Keine Sitzungs-Historie für &f%player%&7."
grim-history-session-not-found: "%prefix% &cSitzung &f%ordinal%&c für &f%player%&c nicht gefunden."

# Sitzungsliste — gültige Platzhalter: %prefix% %player% %page% %max_pages%
grim-history-header: "%prefix% &dZeige Sitzungs-Historie für &f%player% &8[&f%page%&7/&f%max_pages%&8]"
# Einzelne Sitzungszeile — gültige Platzhalter:
#   %prefix% %player% %ordinal% %grim_version% %server_name%
#   %client_version% %client_brand% %duration% %timeago%
#   %violations% %unique_checks% %crashed_marker% %session_uuid% %detail_command%
# %crashed_marker% wird zu grim-history-crashed-marker erweitert für Sitzungen,
# deren Verbindung ohne sauberes Schließen wegfiel (Server-Crash, kill -9,
# Channel-RST ohne UserDisconnectEvent). Für laufende oder sauber geschlossene
# Sitzungen leerer String.
grim-history-session: "<hover:show_text:'&dSitzung &7%session_uuid%<newline>&7Klicke oder führe &e%detail_command% &7aus<newline>&7um Sitzungsdetails anzuzeigen.'>%prefix% &8[&d%grim_version%&8] &8[&d%server_name%&8] &8[&d%client_version%&8] &dSitzung &f%ordinal%&d, Dauer &f%duration%&d, &c%violations%&d Verstöße &8[&c%unique_checks%&8]%crashed_marker% &8(&7vor %timeago%&8)</hover>"

# Inline-Marker, der in %crashed_marker% eingesetzt wird bei Sitzungen mit
# closed_at == last_activity (also vom Crash-Sweep beim nächsten Start
# gestempelt, nicht vom Disconnect-Pfad). Mit führendem Leerzeichen, damit
# der Marker beim Vorhandensein natürlich liest und beim Fehlen verschwindet.
grim-history-crashed-marker: " &8(&cabgestürzt&8)"

# Sitzungsdetails — gültige Platzhalter:
#   %prefix% %player% %ordinal% %grim_version% %server_name%
#   %client_version% %client_brand% %duration% %timeago%
#   %violations% %unique_checks% %bucket_size%
grim-history-detail-header: "%prefix% &dDetails zu Sitzung &f%ordinal% &dvon &f%player%&d:"
grim-history-detail-meta1: "%prefix% &dNSAC: &f%grim_version%&d, Server: &f%server_name%&d, Dauer: &f%duration%&d, Datum: &7vor %timeago%"
grim-history-detail-meta2: "%prefix% &dClient: &f%client_version%&d, Marke: &f%client_brand%"
grim-history-detail-violations-header: "%prefix% &dVerstöße: &8(%violations% gesamt, %unique_checks% verschiedene)"
grim-history-detail-empty: "%prefix% &7- (keine)"
# Gruppenzeile (Standard) — gültige Platzhalter: %prefix% %offset% %checks_list%
#   %bucket_start% %bucket_end% %bucket_hover_entries%
#   %checks_list% wird gebaut aus grim-history-check-count-Einträgen, getrennt mit ", "
grim-history-detail-group: "<hover:show_text:'&dVerstöße in &f%bucket_start%–%bucket_end%&d:%bucket_hover_entries%'>%prefix% &7- %checks_list% &8(&d%offset%&8)</hover>"
grim-history-detail-group-hover: "&dVerstöße in &f%bucket_start%–%bucket_end%&d:%bucket_hover_entries%"
grim-history-detail-group-hover-entry: "<newline>&8  %offset% &d%check%%description%%verbose%"
grim-history-hover-description: " — &f%description%"
grim-history-detail-group-hover-verbose: " — &7%verbose%"
# Einzelner Verstoß (--detailed) — gültige Platzhalter:
#   %prefix% %offset% %check% %description% %vl% %verbose%
grim-history-detail-entry: "%prefix% &7- &f%check% &8(&d%offset%&8)&7 %verbose%"
grim-history-detail-entry-hover: "&d%check%%description%<newline>&8@ %offset% — vl %vl%%verbose%"
grim-history-detail-entry-hover-verbose: "<newline>&7%verbose%"
# Inneres Format für jeden Check in einer Gruppen-%checks_list% — gültige Platzhalter: %check_name% %count%
grim-history-check-count: "&f%check_name%&7 x&c%count%"

# Schema-Marker — siehe Kopf-Kommentar in config.yml.
config-flavor: V2
config-version: 2
